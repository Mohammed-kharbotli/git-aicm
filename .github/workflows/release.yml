name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: |
          pip install -e ".[test]"
          pytest tests/ -v

      - name: Generate CHANGELOG entry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DATE=$(date -u +%Y-%m-%d)
          # Get previous tag
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "$GITHUB_REF_NAME" | head -1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          # Generate categorized changelog from commits
          {
            echo "## [$VERSION] - $DATE"
            echo ""
            # Group by conventional commit type
            FEATS=$(git log "$RANGE" --pretty=format:"%s" | grep -i "^feat" | sed 's/^[^:]*: /- /' || true)
            FIXES=$(git log "$RANGE" --pretty=format:"%s" | grep -i "^fix" | sed 's/^[^:]*: /- /' || true)
            REFACTORS=$(git log "$RANGE" --pretty=format:"%s" | grep -i "^refactor\|^chore\|^perf" | sed 's/^[^:]*: /- /' || true)
            DOCS=$(git log "$RANGE" --pretty=format:"%s" | grep -i "^docs" | sed 's/^[^:]*: /- /' || true)
            if [ -n "$FEATS" ]; then
              echo "### Added"
              echo "$FEATS"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### Fixed"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$REFACTORS" ]; then
              echo "### Changed"
              echo "$REFACTORS"
              echo ""
            fi
            if [ -n "$DOCS" ]; then
              echo "### Docs"
              echo "$DOCS"
              echo ""
            fi
          } > /tmp/new_entry.md
          # Insert after the header lines in CHANGELOG.md
          sed -i '/^## \[Unreleased\]/,/^## \[/{/^## \[Unreleased\]/!{/^## \[/!d}}' CHANGELOG.md
          sed -i "s/^## \[Unreleased\].*/## [Unreleased]\n/" CHANGELOG.md
          # Insert new entry after [Unreleased] section
          sed -i "/^## \[Unreleased\]/r /tmp/new_entry.md" CHANGELOG.md

      - name: Commit CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for ${GITHUB_REF_NAME#v}" || true
          git push origin HEAD:main || true

      - name: Generate checksum
        run: |
          tar czf git-aicm-${{ github.ref_name }}.tar.gz \
            aicm/ git-aicm pyproject.toml LICENSE README.md
          sha256sum git-aicm-${{ github.ref_name }}.tar.gz > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            git-aicm-${{ github.ref_name }}.tar.gz
            SHA256SUMS
