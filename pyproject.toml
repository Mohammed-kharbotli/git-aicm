[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-aicm"
version = "0.4.0"
description = "Generates git commit messages from your diff using an LLM"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["tomli; python_version < '3.11'"]

[project.optional-dependencies]
bedrock = ["boto3>=1.28"]
anthropic = ["anthropic>=0.18"]

test = ["pytest"]

[project.scripts]
git-aicm = "aicm:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aicm*"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

