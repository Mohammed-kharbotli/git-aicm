[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-aicm"
version = "0.2.0"
description = "Generates git commit messages from your diff using an LLM"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
bedrock = ["boto3>=1.28"]
anthropic = ["anthropic>=0.18"]
python39 = ["tomli"]
test = ["pytest"]

[project.scripts]
git-aicm = "aicm:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aicm*"]
