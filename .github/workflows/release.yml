name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bump version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Run tests
        run: |
          pip install -e ".[test]"
          pytest tests/ -v

      - name: Generate CHANGELOG entry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DATE=$(date -u +%Y-%m-%d)
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
          fi
          FEATS=$(git log "$RANGE" --pretty=format:"%s" --no-merges | grep -iE "^feat" | sed 's/^[^:]*: /- /' || true)
          FIXES=$(git log "$RANGE" --pretty=format:"%s" --no-merges | grep -iE "^fix" | sed 's/^[^:]*: /- /' || true)
          CHANGES=$(git log "$RANGE" --pretty=format:"%s" --no-merges | grep -iE "^(refactor|chore|perf)" | sed 's/^[^:]*: /- /' || true)
          {
            echo "## [$VERSION] - $DATE"
            echo ""
            if [ -n "$FEATS" ]; then printf "### Added\n%s\n\n" "$FEATS"; fi
            if [ -n "$FIXES" ]; then printf "### Fixed\n%s\n\n" "$FIXES"; fi
            if [ -n "$CHANGES" ]; then printf "### Changed\n%s\n\n" "$CHANGES"; fi
          } > /tmp/entry.md
          # Insert entry after [Unreleased] line, removing old unreleased content
          python3 << 'EOF'
import re
entry = open("/tmp/entry.md").read()
changelog = open("CHANGELOG.md").read()
changelog = re.sub(
    r"(## \[Unreleased\]).*?(\n## \[)",
    r"\1\n\n" + entry + "\2",
    changelog, count=1, flags=re.DOTALL
)
open("CHANGELOG.md", "w").write(changelog)
EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml
          git commit -m "chore: release ${GITHUB_REF_NAME#v}" || true
          git push origin HEAD:main || true

      - name: Generate checksum
        run: |
          tar czf git-aicm-${{ github.ref_name }}.tar.gz \
            aicm/ git-aicm pyproject.toml LICENSE README.md
          sha256sum git-aicm-${{ github.ref_name }}.tar.gz > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            git-aicm-${{ github.ref_name }}.tar.gz
            SHA256SUMS
